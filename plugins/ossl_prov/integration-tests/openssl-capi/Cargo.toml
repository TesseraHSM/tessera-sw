[package]
edition = "2024"
name = "provider-integration-tests-capi"
version = "0.0.0"

[features]
integration = []
# Start an in-process DDI sock server for a sock-transport build under test.
sock = ["ddi_sock_server/autostart"]

[build-dependencies]
cmake.workspace = true

[dev-dependencies]
ddi_sock_server.workspace = true
libtest-mimic.workspace = true

[lints]
workspace = true

[[test]]
harness = false
name = "openssl_capi_integration_tests"
path = "cpp/openssl_capi_integration_tests.rs"
