# Build-orchestration crate for the TSRA PKCS#11 module.
#
# Like plugins/ossl_prov, this crate carries no Rust code of its own: its
# build.rs drives CMake, which uses Corrosion to import the tsra_api_native
# cdylib, runs cbindgen to generate tsra.h, and compiles the C PKCS#11 module
# (src/*.c) into libtsra_pkcs11.so, linking against tsra_api_native.

[package]
edition = "2024"
name = "tsra_pkcs11"
version = "0.0.1"

[dependencies]

[target.'cfg(target_os = "linux")'.build-dependencies]
cmake.workspace = true
tsra_api_native.workspace = true

[lints]
workspace = true

[features]
default = []
# Test builds only. Forwarded to tsra_api_native: the module reads
# TSRA_TEST_ARGS, so it can talk to a simulator over the DDI socket transport
# and no physical HSM is needed. Run `ddi_sock_server` and set
# TSRA_TEST_ARGS="transport=sock;sock=<endpoint>". The simulator is never
# linked into the module.
test-args = []
