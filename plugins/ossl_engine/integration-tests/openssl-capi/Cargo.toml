[package]
edition = "2024"
name = "engine-integration-tests-capi"
publish = false
version = "0.1.0"

# Gated so a plain `cargo build --workspace` (e.g. a build against
# OpenSSL 3.x) doesn't pull the OpenSSL 1.1.x FFI; the harness builds with
# `--features integration`.
[features]
integration = ["dep:openssl", "dep:tsra_ossl_engine_sys"]
# Start an in-process DDI sock server for a sock-transport build under test.

[dependencies]
openssl = { optional = true, workspace = true }
tsra_ossl_engine_sys = { features = [
  "engine",
], optional = true, path = "../../tsra_ossl_engine_sys" }

[dev-dependencies]
ddi_sock_server = { features = ["autostart"], workspace = true }
serial_test = { workspace = true }

[[test]]
name = "engine_capi_tests"
path = "src/engine_capi_tests.rs"

[lints]
workspace = true
