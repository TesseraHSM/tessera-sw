[package]
edition = "2021"
name = "tsra_fw_hsm_core"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = false

[dependencies]
tsra_fw_core_crypto_aead_envelope.workspace = true
tsra_fw_core_crypto_cose_key.workspace = true
tsra_fw_core_crypto_gcm_buf = { optional = true, workspace = true }
tsra_fw_core_crypto_hpke.workspace = true
tsra_fw_core_crypto_key_derive.workspace = true
tsra_fw_core_crypto_key_masking.workspace = true
tsra_fw_core_crypto_key_report.workspace = true
tsra_fw_core_crypto_x509_builder.workspace = true
tsra_fw_core_crypto_x509_chain.workspace = true
tsra_fw_core_evidence.workspace = true
tsra_fw_ddi_mbor = { features = ["trusted-encode"], workspace = true }
tsra_fw_ddi_mbor_api.workspace = true
tsra_fw_ddi_mbor_types.workspace = true
tsra_fw_ddi_tbor.workspace = true
tsra_fw_ddi_tbor_types.workspace = true
tsra_fw_hsm_core_tracing.workspace = true
tsra_fw_hsm_io.workspace = true
tsra_fw_hsm_key_decode.workspace = true
tsra_fw_hsm_key_unwrap.workspace = true
tsra_fw_hsm_oob.workspace = true
tsra_fw_hsm_pal_traits.workspace = true
tsra_fw_hsm_undo.workspace = true

zerocopy.workspace = true

[features]
default = ["std"]
# Full legacy MBOR DDI command set. Without it, MBOR `EstablishCredential`
# and `RsaUnwrap` are compiled out; every other MBOR command stays.
mbor = []
std = []
# Test-only TBOR commands (`TestAesGcm`, 0xF0): raw-key crypto with no
# session, for bringing up platform crypto engines. Never enable in a
# production build.
tbor-test-cmds = ["dep:tsra_fw_core_crypto_gcm_buf"]
tracing = []
