[package]
edition = "2021"
name = "tsra_fw_hsm_core_tracing"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = false

[features]
## Debug-log output for Uno images: with no `level-*` feature and a bare-metal
## target, `error!`, `warn!`, and `info!` go to the Uno log crate.
debug-log = ["dep:tsra_fw_uno_debug_log"]
default = []

## Log level threshold (compile-time). Only messages at or above the
## selected level are compiled in. Default (no feature): error only.
## Enable exactly one:
level-debug = [] # debug + info + warn + error
level-error = [] # error only (default when tracing is on)
level-info = []  # info + warn + error
level-trace = [] # all levels
level-warn = []  # warn + error

[dependencies]
tsra_fw_uno_debug_log = { optional = true, path = "../../plat/uno/fw/crates/debug_log" }

[lints]
workspace = true
