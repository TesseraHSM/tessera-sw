[package]
edition = "2021"
name = "tsra_fw_hsm_core_tracing"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = false

[features]
## Debug-log output for Uno images: on a bare-metal target, `error!`,
## `warn!`, and `info!` go to the Uno log crate, whatever the `level-*`
## features.
debug-log = ["dep:tsra_fw_uno_debug_log"]
default = []

## Log level threshold for text output (compile-time). Only messages at or
## above the selected level print. With no level feature, nothing prints.
## Enable at most one:
level-debug = [] # debug + info + warn + error
level-error = [] # error only
level-info = []  # info + warn + error
level-trace = [] # all levels
level-warn = []  # warn + error

[dependencies]
tsra_fw_uno_debug_log = { optional = true, path = "../../plat/uno/fw/crates/debug_log" }

[lints]
workspace = true
