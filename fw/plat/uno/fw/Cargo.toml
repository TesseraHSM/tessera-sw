tsra_fw_static_ref = { path = "crates/static_ref" }
tsra_fw_uno_cert_blob = { path = "crates/cert_blob" }
tsra_fw_uno_reg_cortex_m = { path = "reg/cortex-m" }

tsra_fw_uno_drivers_aes = { path = "drivers/aes" }
tsra_fw_uno_drivers_bks_store = { path = "drivers/bks_store" }
tsra_fw_uno_drivers_boot_status = { path = "drivers/boot_status" }
tsra_fw_uno_drivers_core_status = { path = "drivers/core_status" }
tsra_fw_uno_drivers_gdma = { path = "drivers/gdma" }
tsra_fw_uno_drivers_iic = { path = "drivers/iic" }
tsra_fw_uno_drivers_ipc = { path = "drivers/ipc" }
tsra_fw_uno_drivers_nvic = { path = "drivers/nvic" }
tsra_fw_uno_drivers_oic = { path = "drivers/oic" }
tsra_fw_uno_drivers_part_store = { path = "drivers/part_store" }
tsra_fw_uno_drivers_pqc = { path = "drivers/pqc" }
tsra_fw_uno_drivers_profile = { default-features = false, path = "drivers/profile" }
tsra_fw_uno_drivers_rng = { path = "drivers/rng" }
tsra_fw_uno_drivers_semihosting = { path = "drivers/semihosting" }
tsra_fw_uno_drivers_session_store = { path = "drivers/session_store" }
tsra_fw_uno_drivers_sha = { path = "drivers/sha" }
tsra_fw_uno_drivers_systick = { path = "drivers/systick" }
tsra_fw_uno_drivers_uart = { path = "drivers/uart" }
tsra_fw_uno_drivers_upka = { path = "drivers/upka" }
tsra_fw_uno_drivers_vault = { path = "drivers/vault" }
tsra_fw_uno_error = { path = "crates/error" }
tsra_fw_uno_fault = { path = "crates/fault" }
tsra_fw_uno_key_vault = { path = "crates/key_vault" }
tsra_fw_uno_pac = { path = "drivers/pac" }
tsra_fw_uno_pal = { path = "pal" }
tsra_fw_uno_reg_soc = { path = "reg/soc" }
tsra_fw_uno_trace = { path = "crates/trace" }

tsra_fw_core_crypto_key_derive = { path = "../../../core/crypto/key-derive" }
tsra_fw_core_crypto_key_masking = { path = "../../../core/crypto/key-masking" }
tsra_fw_core_crypto_x509_builder = { path = "../../../core/crypto/x509-builder" }
tsra_fw_ddi_mbor = { path = "../../../core/ddi/mbor/codec" }
tsra_fw_ddi_mbor_derive = { path = "../../../core/ddi/mbor/derive" }
