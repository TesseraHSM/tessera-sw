  "crates/cert_blob",
  "crates/error",
  "crates/fault",
  "crates/key_vault",
  "crates/single_cell",
  "crates/static_init",
  "crates/static_ref",
  "crates/trace",
  "drivers/aes",
  "drivers/bks_store",
  "drivers/boot_status",
  "drivers/core_status",
  "drivers/gdma",
  "drivers/iic",
  "drivers/ipc",
  "drivers/nvic",
  "drivers/oic",
  "drivers/pac",
  "drivers/part_store",
  "drivers/pqc",
  "drivers/profile",
