[package]
edition = "2021"
name = "tsra_fw_uno_drivers_systick"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = false

[features]
default = []

# Retarget the driver at the TSRA fastpath cores (750 MHz core clock)
# instead of the HSM core (450 MHz).
fp-core = []

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
critical-section = { workspace = true }
embassy-time-driver = { workspace = true }
embassy-time-queue-utils = { workspace = true }
portable-atomic = { workspace = true }

[lints]
workspace = true
