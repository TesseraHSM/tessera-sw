[package]
edition = "2021"
name = "tsra_ddi_vsock"
version = "0.1.0"

[lib]
doctest = false

[dependencies]
libc.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tsra_ddi_interface.workspace = true
tsra_ddi_mbor_codec.workspace = true
tsra_ddi_mbor_types.workspace = true
tsra_ddi_sock_proto.workspace = true
tsra_ddi_tbor_codec.workspace = true
tsra_ddi_tbor_types.workspace = true
tsra_fw_hsm_io.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { features = ["socket"], workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { features = ["socket"], workspace = true }
tsra_cred_encrypt.workspace = true
tsra_crypto.workspace = true
# NOT given a forced feature here (see the `real-session-tests` feature
# below for why): `tsra_ddi_mbor_test_helpers`'s generic
# `<TsraDdi as Ddi>::Dev` helpers (used by this crate's real-session
# regression test) only resolve to this crate's own `DdiVsockDev` when
# `tsra_ddi`'s "vsock" feature is active. This is a dev-dependency-only
# cycle back onto this crate (through the `tsra_ddi` facade's optional
# `tsra_ddi_vsock` dep), which Cargo supports for test-only code.
tsra_ddi.workspace = true
tsra_ddi_mbor_test_helpers.workspace = true
x509.workspace = true

[features]
# Enables the real-session stale-close regression test in
# tests/vsocksrv_integration.rs, which needs `tsra_ddi`'s "vsock"
# feature active so `tsra_ddi_mbor_test_helpers`'s `<TsraDdi as
# Ddi>::Dev`-generic helpers resolve to this crate's own `DdiVsockDev`.
#
# This is deliberately opt-in (not forced on by the dev-dependency
# above) rather than forced on in `[dev-dependencies]`: Cargo unifies a
# shared dependency's activated features across every package built in
# the same invocation, so forcing "vsock" on unconditionally would leak
# into *any* other workspace-wide build/test/clippy invocation that
# also builds this crate's tests, breaking other crates' tests that
# assume `TsraDdi` resolves to their own intended backend (`emu`,
# `mock`, or the default `nix`/`win`) and tripping `tsra_ddi`'s
# mutual-exclusivity `compile_error!`s when another backend feature is
# active in the same build. Gating it behind this feature confines
# "vsock" activation to dedicated invocations that explicitly request
# it (see the `ci-vsock-ddi` nextest profile / CI job), matching the
# pattern `ddi/mbor/types/Cargo.toml` uses for its own `emu`/`mock`
# features.
real-session-tests = ["tsra_ddi/vsock"]

[lints]
workspace = true
