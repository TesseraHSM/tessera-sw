[package]
edition = "2024"
name = "ddi_sock_server"
version = "0.1.0"

[lib]
doctest = false

[features]
# Read `TSRA_TEST_ARGS` (`resource_count`) in test builds of the server.
test-args = ["dep:tsra_ddi"]
# Start an in-process server before `main` in executables that link this
# crate. Never enable it for a library loaded by another program.
autostart = ["test-args"]
# Like `autostart`, but always start a private server and set its endpoint
# only for this process, not in `TSRA_TEST_ARGS` (e.g. for libFuzzer
# `-jobs`/`-fork` workers).
autostart-isolated = ["autostart"]
# Forward the per-IO `iic recv` / `oic send` debug traces of the served firmware.
trace-io = ["tsra_fw_hsm_std/trace-io"]

[dependencies]
tokio = { features = [
  "io-util",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
], workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
tsra_ddi = { optional = true, workspace = true }
tsra_ddi_mbor_types.workspace = true
tsra_ddi_sock_proto.workspace = true
tsra_ddi_tbor_types.workspace = true
tsra_fw_hsm_bulk.workspace = true
tsra_fw_hsm_io.workspace = true
tsra_fw_hsm_std.workspace = true

[dev-dependencies]
parking_lot.workspace = true
tokio = { features = ["test-util"], workspace = true }
tsra_crypto.workspace = true
tsra_ddi_interface.workspace = true
tsra_ddi_sock.workspace = true
tsra_ddi_tbor_test_harness.workspace = true
tsra_session_ex_crypto.workspace = true
x509.workspace = true

[lints]
workspace = true
