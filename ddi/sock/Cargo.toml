[package]
edition = "2021"
name = "tsra_ddi_sock"
version = "0.1.0"
# The wire-protocol and server crates live in nested directories and are
# their own workspace members; exclude them from this package.
exclude = ["proto", "server"]

[lib]
doctest = false

[dependencies]
parking_lot.workspace = true
tracing.workspace = true
tsra_ddi_interface.workspace = true
tsra_ddi_mbor_codec.workspace = true
tsra_ddi_mbor_types.workspace = true
tsra_ddi_sock_proto.workspace = true
tsra_ddi_tbor_codec.workspace = true
tsra_ddi_tbor_types.workspace = true
tsra_fw_hsm_bulk.workspace = true
tsra_fw_hsm_io.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix = { features = ["socket"], workspace = true }

[dev-dependencies]
ddi_sock_server = { features = ["test-args"], workspace = true }
tsra_ddi.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { features = ["signal"], workspace = true }

[lints]
workspace = true
