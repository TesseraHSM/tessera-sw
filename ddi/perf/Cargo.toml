[package]
edition = "2021"
name = "tsra_ddi_perf"
version = "0.1.0"

[[bin]]
name = "tsra_ddi_perf"
path = "src/main.rs"

[dependencies]
clap = { features = ["derive"], workspace = true }
ddi_sock_server = { optional = true, workspace = true }
rand.workspace = true
tsra_crypto.workspace = true
tsra_ddi.workspace = true
tsra_ddi_interface.workspace = true
tsra_ddi_mbor_types.workspace = true
tsra_ddi_tbor_test_harness.workspace = true
tsra_ddi_tbor_types.workspace = true
zeroize.workspace = true

[features]
default = []
# Run against the in-process simulated HSM (or an external server named by
# `TSRA_DDI_SOCK`) instead of the device driver.
sock = [
  "ddi_sock_server/autostart",
  "dep:ddi_sock_server",
  "tsra_ddi/sock",
  "tsra_ddi_tbor_test_harness/sock",
]

[lints]
workspace = true
