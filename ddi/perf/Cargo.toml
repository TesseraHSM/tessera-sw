[package]
edition = "2021"
name = "tsra_ddi_perf"
version = "0.1.0"

[[bin]]
name = "tsra_ddi_perf"
path = "src/main.rs"

[dependencies]
clap = { features = ["derive"], workspace = true }
ddi_sock_server = { features = [
  "autostart",
], optional = true, workspace = true }
rand.workspace = true
tsra_crypto.workspace = true
tsra_ddi.workspace = true
tsra_ddi_interface.workspace = true
tsra_ddi_mbor_types.workspace = true
tsra_ddi_tbor_test_harness.workspace = true
tsra_ddi_tbor_types.workspace = true
zeroize.workspace = true

[features]
default = []
# Read `TSRA_TEST_ARGS` and, with `transport=sock`, run against the in-process
# simulated HSM (or an external server named by `sock=`) instead of the device
# driver. Opt-in so normal workspace builds do not start a simulator.
test-args = ["dep:ddi_sock_server"]

[lints]
workspace = true
