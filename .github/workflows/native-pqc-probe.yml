name: Native PQC probe

on:
  push:
    branches: [probe/native-pqc-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe native CNG PQC
        shell: pwsh
        run: ./.github/scripts/native-pqc-probe.ps1
