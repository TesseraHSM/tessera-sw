name: Smoke-Test Fuzz Targets

on:
  push:
    branches: [ main, dev, fw-main ]
  pull_request:
    branches: [ main, dev, fw-main ]
  merge_group:
    branches: [ main, dev, fw-main ]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # Daily at midnight PST (8 AM UTC)
env:
  CARGO_TERM_COLOR: always
  CACHE_KEY_ID: 9709feeb3d4e548df12fa714f6280701bd98c486

jobs:
  fuzz_smoke:
    runs-on: ubuntu-24.04

    env:
      # The version of `cargo-fuzz` to install and use.
      CARGO_FUZZ_VERSION: 0.12.0

      # The number of seconds to run the fuzz target.
      FUZZ_TIME: 10

    defaults:
      run:
        working-directory: fuzz

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/ubuntu-setup
      id: ubuntu-setup
    - run: rustup toolchain install nightly
    - name: Install nightly rustfmt
      if: steps.ubuntu-setup.outputs.cache-hit == 'true'
      run: rustup component add --toolchain nightly rustfmt
    - name: Install clippy
      if: steps.ubuntu-setup.outputs.cache-hit == 'true'
      run: rustup component add clippy

    # Install and cache `cargo-fuzz`.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-fuzz
        key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}
    - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> $GITHUB_PATH
    - run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" --version ${{ env.CARGO_FUZZ_VERSION }} cargo-fuzz --locked

    - run: cargo +nightly fmt -- --check
    - run: cargo clippy -- -D warnings
    - run: cargo +nightly fuzz build
    - name: Run fuzz smoke tests (${{ env.FUZZ_TIME }}s each)
      run: |
        TARGETS=$(cargo fuzz list)

        echo "Found fuzz targets:"
        echo "$TARGETS"
        echo ""

        seed=1
        for target in $TARGETS; do
          echo "[$seed] Fuzzing $target for ${{ env.FUZZ_TIME }} seconds..."
          cargo fuzz run "$target" -- -max_total_time=${{ env.FUZZ_TIME }} -seed=$seed -print_final_stats=1
          seed=$((seed + 1))
          echo ""
        done

    - name: Upload fuzzing artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzzing-artifacts-${{ github.sha }}
        path: fuzz/artifacts
