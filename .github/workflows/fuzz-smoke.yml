name: Smoke-Test Fuzz Targets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fuzz_checks:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: fuzz

    steps:
    - uses: actions/checkout@v4

    - run: rustup toolchain install nightly

    - run: cargo +nightly fmt -- --check
    - run: cargo clippy -- -D warnings

  fuzz:
    runs-on: ubuntu-24.04

    env:
      # The version of `cargo-fuzz` to install and use.
      CARGO_FUZZ_VERSION: 0.12.0

      # The number of seconds to run the fuzz target. 300 seconds = 5 minutes.
      FUZZ_TIME: 300

    strategy:
      fail-fast: false
      matrix:
        include:
          # TODO: List your fuzz targets here.
          - fuzz_target: fuzz_tbor_aes_encrypt_decrypt
          - fuzz_target: fuzz_tbor_app_ops
          - fuzz_target: fuzz_tbor_attest_key
          - fuzz_target: fuzz_tbor_cmd_reqs
          - fuzz_target: fuzz_tbor_concat_kdf_derive
          - fuzz_target: fuzz_tbor_dispatcher
          - fuzz_target: fuzz_tbor_dispatcher_aes_fp
          - fuzz_target: fuzz_tbor_ecc_generate_key
          - fuzz_target: fuzz_tbor_ecc_sign
          - fuzz_target: fuzz_tbor_ecdh_key_exchange
          - fuzz_target: fuzz_tbor_establish_credential
          - fuzz_target: fuzz_tbor_get_cert
          - fuzz_target: fuzz_tbor_get_cert_chain_info
          - fuzz_target: fuzz_tbor_get_unwrapping_key
          - fuzz_target: fuzz_tbor_hkdf
          - fuzz_target: fuzz_tbor_hmac
          - fuzz_target: fuzz_tbor_hmac_generate_key
          - fuzz_target: fuzz_tbor_key_report
          - fuzz_target: fuzz_tbor_part_final
          - fuzz_target: fuzz_tbor_part_info
          - fuzz_target: fuzz_tbor_part_init
          - fuzz_target: fuzz_tbor_psk_change
          - fuzz_target: fuzz_tbor_request_round_trip
          - fuzz_target: fuzz_tbor_request_view
          - fuzz_target: fuzz_tbor_response_round_trip
          - fuzz_target: fuzz_tbor_response_view
          - fuzz_target: fuzz_tbor_rsa_mod_exp
          - fuzz_target: fuzz_tbor_rsa_unwrap
          - fuzz_target: fuzz_tbor_sd_create_peer_backup
          - fuzz_target: fuzz_tbor_sd_create_remote_backup
          - fuzz_target: fuzz_tbor_sd_reseal_remote_backup
          - fuzz_target: fuzz_tbor_sd_restore_local_backup
          - fuzz_target: fuzz_tbor_sd_restore_peer_backup
          - fuzz_target: fuzz_tbor_sd_restore_remote_backup
          - fuzz_target: fuzz_tbor_sd_sealing_key_gen
          - fuzz_target: fuzz_tbor_session_open_round_trip
          - fuzz_target: fuzz_tbor_unwrap_key
          # etc...

    steps:
    - uses: actions/checkout@v4

    # Install the nightly Rust channel.
    - run: rustup toolchain install nightly
    - run: rustup default nightly

    # Install and cache `cargo-fuzz`.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-fuzz
        key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}
    - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> $GITHUB_PATH
    - run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" --version ${{ env.CARGO_FUZZ_VERSION }} cargo-fuzz --locked

    # Build and then run the fuzz target.
    - run: cargo +nightly fuzz build ${{ matrix.fuzz_target }} --features emu
    - run: cargo +nightly fuzz run ${{ matrix.fuzz_target }} --features emu -- -max_total_time=${{ env.FUZZ_TIME }}

    # Upload fuzzing artifacts on failure for post-mortem debugging.
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzzing-artifacts-${{ matrix.fuzz_target }}-${{ github.sha }}
        path: fuzz/artifacts
