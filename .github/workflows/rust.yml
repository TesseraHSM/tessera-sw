name: Rust

on:
  push:
    branches: [ main, dev, fw-main ]
  pull_request:
    branches: [ main, dev, fw-main ]
  merge_group:
    branches: [ main, dev, fw-main ]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # Daily at midnight PST (8 AM UTC)
env:
  CARGO_TERM_COLOR: always
  CACHE_KEY_ID: 9709feeb3d4e548df12fa714f6280701bd98c486

jobs:
  build:

    name: build_${{ matrix.label }}

    strategy:
      fail-fast: false
      matrix: &os-matrix
        include:
          - label: ubuntu
            runner: ubuntu-24.04
          - label: windows
            runner: windows-2025-vs2026

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      if: matrix.label == 'ubuntu'
      id: ubuntu-setup
    - uses: ./.github/actions/windows-setup
      if: matrix.label == 'windows'
      id: windows-setup
    - name: Install nightly rustfmt
      if: steps.ubuntu-setup.outputs.cache-hit == 'true' || steps.windows-setup.outputs.cache-hit == 'true'
      run: cargo xtask rustup-component-add --component rustfmt --toolchain nightly
    - name: Install clippy
      if: steps.ubuntu-setup.outputs.cache-hit == 'true' || steps.windows-setup.outputs.cache-hit == 'true'
      run: cargo xtask rustup-component-add --component clippy
    - name: Run Copyright
      run: cargo xtask precheck --copyright
    - name: Run Audit
      run: cargo xtask precheck --audit
    - name: Cargo format
      run: cargo xtask precheck --fmt
    - name: Cargo Clippy
      run: cargo xtask precheck --clippy
    - name: Install clang-format-18
      if: matrix.label == 'ubuntu'
      run: sudo apt-get update && sudo apt-get install -y clang-format-18
    - name: Check committed C header is up to date
      if: matrix.label == 'ubuntu'
      run: cargo xtask precheck --cbindgen

  test_mock:

    name: test_${{ matrix.label }}_mock

    strategy:
      fail-fast: false
      matrix: *os-matrix

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      if: matrix.label == 'ubuntu'
    - uses: ./.github/actions/windows-setup
      if: matrix.label == 'windows'
    - name: Run all mock tests (except tsra_api_tests)
      id: test-mock
      run: cargo xtask precheck --nextest --exclude tsra_api_tests --exclude provider-integration-tests-cli --exclude provider-integration-tests-capi --exclude provider-integration-tests-nginx -F mock --profile ci-mock
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-mock.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_api:

    name: test_${{ matrix.label }}_api

    strategy:
      fail-fast: false
      matrix: *os-matrix

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      if: matrix.label == 'ubuntu'
    - uses: ./.github/actions/windows-setup
      if: matrix.label == 'windows'
    - name: Run tsra_api_tests
      id: test-api
      run: cargo xtask precheck --nextest -p tsra_api_tests -F mock --profile ci-api
      continue-on-error: true
    - name: Run tsra_api_tests with EX sessions against emu
      id: test-api-ex
      run: cargo xtask precheck --nextest -p tsra_api_tests -F emu,session-ex-tests --profile ci-api-ex
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-api.outcome == 'failure' || steps.test-api-ex.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_misc:

    name: test_${{ matrix.label }}_misc

    strategy:
      fail-fast: false
      matrix: *os-matrix

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      if: matrix.label == 'ubuntu'
    - uses: ./.github/actions/windows-setup
      if: matrix.label == 'windows'
    - name: SDK Run all mock tests table-4
      if: matrix.label == 'ubuntu'
      id: test-mock-table-4
      run: cargo xtask precheck --nextest -p tsra_ddi_mbor_types -F mock,table-4 --profile ci-mock-table-4
      continue-on-error: true
    - name: SDK Run all mock tests table-64
      if: matrix.label == 'ubuntu'
      id: test-mock-table-64
      run: cargo xtask precheck --nextest -p tsra_ddi_mbor_types -F mock,table-64 --profile ci-mock-table-64
      continue-on-error: true
    - name: SDK Run TBOR types tests against emu backend
      if: matrix.label == 'ubuntu'
      id: test-tbor-emu
      run: cargo xtask precheck --nextest -p tsra_ddi_tbor_types -F emu --profile ci-tbor-emu
      continue-on-error: true
    - name: Run resiliency fault injection tests
      id: test-res-fault
      run: cargo xtask precheck --nextest -p tsra_api_tests -F mock,res-test -E 'test(resiliency::fault_injection::)' --profile ci-mock-res
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-mock-table-4.outcome == 'failure' || steps.test-mock-table-64.outcome == 'failure' || steps.test-tbor-emu.outcome == 'failure' || steps.test-res-fault.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_smoke:

    name: test_${{ matrix.label }}_smoke

    strategy:
      fail-fast: false
      matrix: *os-matrix

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      if: matrix.label == 'ubuntu'
    - uses: ./.github/actions/windows-setup
      if: matrix.label == 'windows'
    - name: Run emu smoke tests
      id: test-emu-smoke
      run: cargo xtask precheck --nextest --package tsra_ddi_mbor_types --features emu --test tsra_ddi_tests --filter smoke --profile ci-emu-smoke
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-emu-smoke.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_emu_ddi:

    name: test_${{ matrix.label }}_emu_ddi

    strategy:
      fail-fast: false
      matrix: *os-matrix

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      if: matrix.label == 'ubuntu'
    - uses: ./.github/actions/windows-setup
      if: matrix.label == 'windows'
    - name: Run emu DDI tests
      id: test-emu-ddi
      run: cargo xtask precheck --nextest --package tsra_ddi_mbor_types --features emu --test tsra_ddi_tests --profile ci-emu-ddi
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-emu-ddi.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1
