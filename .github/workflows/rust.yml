name: Rust

on:
  push:
    branches: [ main, dev, fw-main, feature/pkcs11 ]
  pull_request:
    branches: [ main, dev, fw-main, feature/pkcs11 ]
  merge_group:
    branches: [ main, dev, fw-main ]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # Daily at midnight PST (8 AM UTC)
env:
  CARGO_TERM_COLOR: always
  CACHE_KEY_ID: 9709feeb3d4e548df12fa714f6280701bd98c486

jobs:
  build_ubuntu:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
      id: ubuntu-setup
    - name: Install nightly rustfmt
      if: steps.ubuntu-setup.outputs.cache-hit == 'true'
      run: cargo xtask rustup-component-add --component rustfmt --toolchain nightly
    - name: Install clippy
      if: steps.ubuntu-setup.outputs.cache-hit == 'true'
      run: cargo xtask rustup-component-add --component clippy
    - name: Run Copyright
      run: cargo xtask precheck --copyright
    - name: Run Audit
      run: cargo xtask precheck --audit
    - name: Cargo format
      run: cargo xtask precheck --fmt
    - name: Cargo Clippy
      run: cargo xtask precheck --clippy
    - name: Install clang-format-18
      run: sudo apt-get update && sudo apt-get install -y clang-format-18
    - name: Check committed C header is up to date
      run: cargo xtask precheck --cbindgen

  test_ubuntu_emu:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
    - name: Run all emu tests (except tsra_api_tests)
      id: test-emu
      run: cargo xtask precheck --nextest --exclude tsra_api_tests --exclude provider-integration-tests-cli --exclude provider-integration-tests-capi --exclude provider-integration-tests-nginx -F emu --profile ci-emu
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-emu.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_ubuntu_api:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
    - name: Run tsra_api_tests
      id: test-api
      run: cargo xtask precheck --nextest -p tsra_api_tests -F emu --profile ci-api
      continue-on-error: true
    - name: Run tsra_api_tests with EX sessions against emu
      id: test-api-ex
      run: cargo xtask precheck --nextest -p tsra_api_tests -F emu,session-ex-tests --profile ci-api-ex
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-api.outcome == 'failure' || steps.test-api-ex.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_ubuntu_misc:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/ubuntu-setup
    - name: SDK Run MBOR types tests on emu with 4 partition resources
      id: test-emu-res-4
      env:
        TSRA_EMU_RESOURCE_COUNT: "4"
      run: cargo xtask precheck --nextest -p tsra_ddi_mbor_types -F emu --profile ci-emu-res-4
      continue-on-error: true
    - name: SDK Run MBOR types tests on emu with 64 partition resources
      id: test-emu-res-64
      env:
        TSRA_EMU_RESOURCE_COUNT: "64"
      run: cargo xtask precheck --nextest -p tsra_ddi_mbor_types -F emu --profile ci-emu-res-64
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-emu-res-4.outcome == 'failure' || steps.test-emu-res-64.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  build_windows:

    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/windows-setup
      id: windows-setup
    - name: Install nightly rustfmt
      if: steps.windows-setup.outputs.cache-hit == 'true'
      run: cargo xtask rustup-component-add --component rustfmt --toolchain nightly
    - name: Install clippy
      if: steps.windows-setup.outputs.cache-hit == 'true'
      run: cargo xtask rustup-component-add --component clippy
    - name: Run Copyright
      run: cargo xtask precheck --copyright
    - name: Run Audit
      run: cargo xtask precheck --audit
    - name: Cargo format
      run: cargo xtask precheck --fmt
    - name: Cargo Clippy
      run: cargo xtask precheck --clippy

  test_windows_emu:

    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/windows-setup
    - name: Run all emu tests (except tsra_api_tests)
      id: test-emu
      run: cargo xtask precheck --nextest --exclude tsra_api_tests --exclude provider-integration-tests-cli --exclude provider-integration-tests-capi --exclude provider-integration-tests-nginx -F emu --profile ci-emu
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-emu.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1

  test_windows_api:

    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/windows-setup
    - name: Run tsra_api_tests
      id: test-api
      run: cargo xtask precheck --nextest -p tsra_api_tests -F emu --profile ci-api
      continue-on-error: true
    - name: Run tsra_api_tests with EX sessions against emu
      id: test-api-ex
      run: cargo xtask precheck --nextest -p tsra_api_tests -F emu,session-ex-tests --profile ci-api-ex
      continue-on-error: true
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
    - name: Fail if any tests failed
      if: ${{ steps.test-api.outcome == 'failure' || steps.test-api-ex.outcome == 'failure' }}
      run: |
        echo "One or more tests failed."
        exit 1
