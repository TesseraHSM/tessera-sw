[package]
edition = "2024"
name = "tsra_sdk_fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
tsra_crypto = { path = "../crates/crypto" }
tsra_ddi = { path = "../ddi/lib" }
tsra_ddi_emu = { optional = true, path = "../ddi/emu" }
tsra_ddi_interface = { path = "../ddi/interface" }
tsra_ddi_mbor_sim = { path = "../ddi/mbor/sim" }
tsra_ddi_tbor_codec = { path = "../ddi/tbor/codec" }
tsra_ddi_tbor_test_harness = { path = "../crates/tbor_test_harness" }
tsra_ddi_tbor_types = { path = "../ddi/tbor/types" }
tsra_session_ex_crypto = { path = "../crates/session_ex_crypto" }
x509 = { path = "../crates/x509" }
zerocopy = { features = ["derive"], version = "0.8.17" }

# dependencies for fuzzing
libfuzzer-sys = { features = ["arbitrary-derive"], version = "0.4" }
minicbor = "0.19.1"

[features]
default = []
emu = ["tsra_ddi/emu", "tsra_ddi_tbor_test_harness/emu"]

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_request_round_trip"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_request_round_trip.rs"
test = false

