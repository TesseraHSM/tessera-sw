language = "C"

header = "/*\n * Copyright (c) Microsoft Corporation.\n * Licensed under the MIT License.\n */"

cpp_compat = true

include_guard = "TSRA_API_H"

documentation_style = "c"

# Codegen Options

# When generating a C header, the kind of declaration style to use for structs
# or enums.
#
# possible values:
# * "type": typedef struct { ... } MyType;
# * "tag": struct MyType { ... };
# * "both": typedef struct MyType { ... } MyType;
#
# default: "both"
style = "tag"

# If this option is true `usize` and `isize` will be converted into `size_t` and `ptrdiff_t`
# instead of `uintptr_t` and `intptr_t` respectively.
usize_is_size_t = true

[export]

# A list of items to not include in the generated bindings
# default: []
exclude = ["TsraWideChar"]
include = [
  "HsmEccCurve",
  "HsmError",
  "HsmKeyClass",
  "HsmKeyKind",
  "HsmPartType",
  "TsraAlgoAesCbcParams",
  "TsraAlgoAesGcmParams",
  "TsraAlgoAesXtsParams",
  "TsraAlgoEcdhParams",
  "TsraAlgoHkdfParams",
  "TsraAlgoKbkdfCounterParams",
  "TsraAlgoRsaAesKeyWrapParams",
  "TsraAlgoRsaAesWrapParams",
  "TsraAlgoRsaPkcsOaepParams",
  "TsraAlgoRsaPkcsPssParams",
  "TsraDarcCertChain",
  "TsraDarcKeyUnwrapParams",
  "TsraDarcKeyWrapParams",
  "TsraDarcTmkExportParams",
  "TsraDarcTmkImportParams",
  "TsraMobkCallbackOps",
  "TsraPotaCallbackOps",
  "TsraResiliencyConfig",
  "TsraResiliencyLockOps",
  "TsraResiliencyStorageOps",
  "TsraSdCertChain",
  "TsraSdCreatePeerBackupParams",
  "TsraSdCreateRemoteBackupParams",
  "TsraSdEvidence",
  "TsraSdResealRemoteBackupParams",
  "TsraSdRestoreLocalBackupParams",
  "TsraSdRestorePeerBackupParams",
  "TsraSdRestoreRemoteBackupParams",
  "TsraSessExPartFinalParams",
  "TsraSessExPartInitParams",
  "TsraSessionPsk",
]

item_types = [
  "constants",
  "enums",
  "functions",
  "opaque",
  "structs",
  "typedefs",
]

