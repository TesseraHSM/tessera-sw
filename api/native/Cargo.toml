[package]
edition = "2024"
name = "tsra_api_native"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
open-enum.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tsra_api.workspace = true
zerocopy = { features = ["derive"], workspace = true }

[features]
default = []
# Read test configuration from TSRA_TEST_ARGS. Test builds only. Select the
# socket transport with transport=sock and name a running ddi_sock_server with
# sock=<endpoint>; the simulator is never linked into this library.
test-args = ["tsra_api/test-args"]

[lints]
workspace = true
