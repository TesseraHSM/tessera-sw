[package]
edition = "2024"
name = "tsra_api_native"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ddi_sock_server = { features = [
  "autostart",
], optional = true, workspace = true }
open-enum.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tsra_api.workspace = true
zerocopy = { features = ["derive"], workspace = true }

[features]
default = []
sock = ["tsra_api/sock"]
# Test builds only: also link an in-process simulator that autostarts when the
# library loads (unless TSRA_DDI_SOCK is set), so every process that loads the
# library gets its own fresh emulated HSM.
sock-autostart = ["dep:ddi_sock_server", "sock"]

[lints]
workspace = true
