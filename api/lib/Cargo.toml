[package]
edition = "2024"
name = "tsra_api"
version = "0.0.0"

[dependencies]
bitflags.workspace = true
cfg-if.workspace = true
delegate.workspace = true
env_logger.workspace = true
itertools.workspace = true
log.workspace = true
open-enum.workspace = true
parking_lot.workspace = true
pastey.workspace = true
rand.workspace = true
resiliency_macro.workspace = true
test_with_tracing.workspace = true
tracing.workspace = true
tsra_cred_encrypt.workspace = true
tsra_crypto.workspace = true
tsra_ddi.workspace = true
tsra_ddi_mbor_codec.workspace = true
tsra_ddi_mbor_types.workspace = true
tsra_ddi_tbor_types.workspace = true
tsra_res_test_dev = { optional = true, workspace = true }
tsra_session_ex_crypto.workspace = true
tsra_tpm.workspace = true
x509.workspace = true
zerocopy = { features = ["derive"], workspace = true }
zeroize.workspace = true

[features]
default = []
emu = ["tsra_ddi/emu"]
mock = ["tsra_ddi/mock"]
res-test = ["tsra_res_test_dev"]
sock = ["tsra_ddi/sock"]
# Forward the per-IO `iic recv` / `oic send` debug traces (emu backend only).
trace-io = ["tsra_ddi/trace-io"]

[lints]
workspace = true
