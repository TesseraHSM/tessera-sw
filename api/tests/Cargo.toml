[package]
edition = "2024"
name = "tsra_api_tests"
version = "0.0.0"

[dependencies]
tsra_res_test_dev = { optional = true, workspace = true }

[build-dependencies]
anyhow.workspace = true
cmake.workspace = true
env_logger.workspace = true
log.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
xshell.workspace = true

[dev-dependencies]
hex.workspace = true
libtest-mimic.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
tsra_api.workspace = true
tsra_api_tests_macro.workspace = true
tsra_crypto = { features = ["testvectors"], workspace = true }
tsra_ddi_tbor_types.workspace = true
tsra_resiliency_test_helpers.workspace = true
x509.workspace = true
zerocopy.workspace = true

[features]
default = []
emu = ["tsra_api/emu"]
mock = ["tsra_api/mock"]
res-test = ["dep:tsra_res_test_dev", "tsra_api/res-test"]
session-ex-tests = []

[lints]
workspace = true

[[test]]
harness = false
name = "cpp"
path = "cpp/tests.rs"
